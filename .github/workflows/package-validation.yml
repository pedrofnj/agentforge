name: Package validation

# Packs the npm tarball, installs it in a temporary directory and runs the
# packaged CLI against an isolated home on every OS (scripts/smoke-pack.mjs).
# Real ~/.claude, ~/.codex and ~/.agents are never touched.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: packaged CLI (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm pack --dry-run
      - run: npm run smoke
