name: Bug report
description: Something in the CLI, installer or generated files does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        English or Portuguese is fine. For security issues, do **not** use this form: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the exact command and its output (remove secrets and private paths).
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: agentforge --version
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Client
      options: [Claude Code, Codex, Both, Not client-specific]
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS and Node.js version
      placeholder: e.g. Windows 11, Node 24.1
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: agentforge doctor --verbose output
      render: text
