kind: Deployment
spec:
  containers:
    - name: worker
      image: registry.example.com/worker@sha256:3f1c4b8a9e2d7c6b5a4f3e2d1c0b9a8f7e6d5c4b3a2f1e0d9c8b7a6f5e4d3c2b1
      securityContext:
        runAsNonRoot: true
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
      resources:
        limits:
          cpu: "500m"
          memory: 256Mi
